name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.10 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            plugin/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r plugin/requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build PCM package
        run: python scripts/build_pcm.py
      - name: Validate release inputs
        run: python scripts/validate_release.py
      - name: Upload package smoke-test artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: every-test-point-pcm
          path: dist/*.zip
          if-no-files-found: error
