name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            plugin/requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r plugin/requirements.txt -r requirements-dev.txt
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Build and validate package
        id: package
        shell: bash
        run: |
          version="$(tr -d '\r\n' < plugin/VERSION)"
          archive="dist/every-test-point-${version}.zip"
          python scripts/build_pcm.py
          python scripts/validate_release.py --archive "$archive" --tag "$GITHUB_REF_NAME"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Require the tagged commit on main
        shell: bash
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Generate official-repository metadata
        shell: bash
        run: |
          archive="${{ steps.package.outputs.archive }}"
          python scripts/generate_repository_metadata.py \
            --archive "$archive" \
            --download-url "https://github.com/everypinio/everytestpoint/releases/download/${GITHUB_REF_NAME}/$(basename "$archive")"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.archive }}" \
            "${{ steps.package.outputs.archive }}.sha256" \
            dist/metadata.repository.json \
            --verify-tag \
            --generate-notes \
            --title "Every Test Point ${{ steps.package.outputs.version }}"
